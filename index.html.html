<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng tiến độ thi công</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f3; --surface:#fff; --band:#eceeea; --line:#e1e3de; --text:#1f2622; --muted:#7a827d;
  --accent:#0f5c47; --accent-ink:#fff;
  --todo:#9aa19c; --doing:#2f6fe0; --done:#1c9a6c; --done-bg:#c6f0df; --doing-bg:#d6e4fb; --todo-bg:#eef0ed;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141816; --surface:#1b201d; --band:#242a26; --line:#2f3631; --text:#e8ece9; --muted:#8d968f;
    --accent:#4fc2a0; --accent-ink:#0d1512;
    --done-bg:#1f4a3b; --doing-bg:#1f3558; --todo-bg:#262c28;
  }
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{font-size:17px;margin:0 8px 0 0;font-weight:700}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;color:var(--muted);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
.tab[aria-pressed="true"]{background:var(--band);color:var(--text);font-weight:600}
.spacer{flex:1}
button.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 12px;border-radius:6px;cursor:pointer;font:inherit}
button.btn:hover{background:var(--band)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.primary:hover{background:var(--accent);filter:brightness(1.1)}
:focus-visible{outline:2px solid var(--doing);outline-offset:1px}
.wrap{overflow-x:auto;margin:16px 20px}
table{border-collapse:collapse;width:100%;min-width:980px;background:var(--surface);border:1px solid var(--line)}
th{font-weight:500;color:var(--muted);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.group td{background:var(--band);font-weight:700;border-left:4px solid var(--accent)}
tr.group .gname{display:flex;align-items:center;gap:8px}
.tog{border:0;background:none;color:var(--text);cursor:pointer;width:22px;height:22px;transition:transform .15s}
.tog[aria-expanded="false"]{transform:rotate(-90deg)}
td.indent{padding-left:28px}
input,select,textarea{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:4px;padding:4px 6px;width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--line)}
input:focus,select:focus,textarea:focus{border-color:var(--doing);background:var(--surface)}
.gname input{font-weight:700}
textarea{resize:vertical;min-height:28px;font-size:12px;color:var(--muted)}
.pct{width:64px;text-align:center;font-weight:600;border-radius:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:600;background:var(--todo-bg)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--todo)}
.pill.doing i{background:var(--doing)} .pill.done i{background:var(--done)}
select.st{width:auto;font-size:12px;font-weight:600}
.bar{display:block;position:relative;border-radius:4px;background:var(--todo-bg);height:24px;overflow:hidden;min-width:60px}
.bar b{position:absolute;inset:0 auto 0 0;background:var(--doing-bg)}
.bar.done b{background:var(--done-bg)}
.bar span{position:relative;display:block;text-align:center;line-height:24px;font-weight:600;font-size:12px}
.num{width:60px;text-align:center}
.date{width:134px}
.ro{padding:4px 6px;white-space:nowrap}
.act{display:flex;gap:2px;opacity:0}
tr:hover .act,.act:focus-within{opacity:1}
.ic{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:4px;font:inherit}
.ic:hover{background:var(--band);color:var(--text)}
tr.add td{border-bottom:1px solid var(--line)}
.add button{border:0;background:none;color:var(--text);cursor:pointer;font:inherit;font-weight:500;padding:4px 8px}
.add button:hover{text-decoration:underline}
footer{padding:4px 20px 28px;color:var(--muted);display:flex;gap:16px;align-items:center}
footer strong{color:var(--text)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media print{
  header .btn,header .tabs,.act,.add,.tog{display:none!important}
  header{position:static}
  .wrap{overflow:visible;margin:8px 0}
  input,select,textarea{border:0!important;appearance:none;-webkit-appearance:none}
}
</style>
</head>
<body>
<header>
  <h1>Bảng tiến độ thi công</h1>
  <div class="tabs" role="group" aria-label="Lọc theo trạng thái">
    <button class="tab" data-f="all" aria-pressed="true">Tất cả</button>
    <button class="tab" data-f="todo" aria-pressed="false">Chưa làm</button>
    <button class="tab" data-f="doing" aria-pressed="false">Đang làm</button>
    <button class="tab" data-f="done" aria-pressed="false">Đã xong</button>
  </div>
  <span class="spacer"></span>
  <button class="btn" id="addGroup">Thêm nhóm việc</button>
  <button class="btn primary" id="addTask">Thêm việc</button>
  <button class="btn" id="exp">Xuất JSON</button>
  <button class="btn" id="imp">Nhập JSON</button>
  <button class="btn" id="print">In PDF</button>
  <input type="file" id="file" accept=".json" hidden>
</header>

<div class="wrap">
<table>
  <thead><tr>
    <th style="width:34%">Hạng mục</th>
    <th>Trạng thái</th>
    <th style="width:110px">Tiến độ</th>
    <th>Bắt đầu</th>
    <th>Ngày</th>
    <th>Kết thúc</th>
    <th style="width:24%">Ghi chú</th>
    <th style="width:70px"></th>
  </tr></thead>
  <tbody id="body"></tbody>
</table>
</div>
<footer id="foot"></footer>

<script>
const KEY = "tien-do-thi-cong-v1";
const DAY = 864e5;
const uid = () => Math.random().toString(36).slice(2, 9);
const T = (name, start, days, pct, note = "") => ({ id: uid(), name, start, days, pct, note });

const seed = () => [
  { id: uid(), name: "1. MÓNG & CỌC", open: true, tasks: [
    T("Công tác chuẩn bị", "2026-09-11", 16, 100),
    T("Xây kè đá + định vị cột", "2026-09-27", 22, 100),
    T("Xây hố xử lý nước thải", "2026-10-18", 8, 100),
    T("Đổ cán đất", "2026-10-22", 6, 100) ]},
  { id: uid(), name: "2. PHẦN THÔ GIẰNG CỘT", open: true, tasks: [
    T("Định vị đổ giằng", "2026-10-26", 3, 100),
    T("Đổ trụ - giằng cote nền +200", "2026-10-29", 4, 0, "Giằng 200 đổ nguyên khối bê tông, bố trí sắt (thầu 1/2 - CĐT 1/2)") ]},
  { id: uid(), name: "3. PHẦN THÔ XÂY TƯỜNG TRỆT", open: true, tasks: [] },
  { id: uid(), name: "4. PHẦN THÔ XÂY TƯỜNG - LẦU 1", open: true, tasks: [] },
  { id: uid(), name: "5. PHẦN THÔ - MÁI", open: true, tasks: [] },
  { id: uid(), name: "6. CƠ ĐIỆN MEP", open: true, tasks: [] },
  { id: uid(), name: "7. HOÀN THIỆN", open: true, tasks: [] },
  { id: uid(), name: "8. NỘI THẤT & BÀN GIAO", open: true, tasks: [] },
];

let groups, filter = "all";
try { groups = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!Array.isArray(groups)) groups = seed();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(groups)); } catch (e) {} };

// ---------- ngày ----------
const parse = s => s ? new Date(s + "T00:00:00Z") : null;
const iso = d => d.toISOString().slice(0, 10);
const endOf = t => t.start ? new Date(parse(t.start).getTime() + (Math.max(1, t.days) - 1) * DAY) : null;
const fmt = d => d ? String(d.getUTCDate()).padStart(2, "0") + "/" + String(d.getUTCMonth() + 1).padStart(2, "0") : "";
const statusOf = p => p >= 100 ? "done" : p > 0 ? "doing" : "todo";
const LABEL = { todo: "Chưa làm", doing: "Đang làm", done: "Đã xong" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// tổng hợp nhóm từ các việc con
function rollup(g) {
  const ts = g.tasks.filter(t => t.start);
  if (!g.tasks.length) return { pct: 0, start: null, end: null, days: null, status: "todo" };
  const starts = ts.map(t => +parse(t.start)), ends = ts.map(t => +endOf(t));
  const w = g.tasks.reduce((a, t) => a + Math.max(1, t.days), 0);
  const pct = Math.round(g.tasks.reduce((a, t) => a + t.pct * Math.max(1, t.days), 0) / w);
  const s = starts.length ? new Date(Math.min(...starts)) : null;
  const e = ends.length ? new Date(Math.max(...ends)) : null;
  return { pct, start: s, end: e, days: s ? Math.round((e - s) / DAY) + 1 : null, status: statusOf(pct) };
}

// ---------- hiển thị ----------
function bar(p) {
  return `<span class="bar ${p >= 100 ? "done" : ""}"><b style="width:${p}%"></b><span>${p}%</span></span>`;
}
function render() {
  const rows = [];
  groups.forEach(g => {
    const r = rollup(g);
    const tasks = g.tasks.filter(t => filter === "all" || statusOf(t.pct) === filter);
    if (filter !== "all" && !tasks.length) return;
    rows.push(`<tr class="group" data-g="${g.id}">
      <td><div class="gname"><button class="tog" data-a="tog" aria-expanded="${g.open}" aria-label="Thu gọn hoặc mở nhóm">▼</button>
        <input data-f="gname" value="${esc(g.name)}" aria-label="Tên nhóm"></div></td>
      <td><span class="pill ${r.status}"><i></i>${LABEL[r.status]}</span></td>
      <td>${bar(r.pct)}</td>
      <td class="ro">${fmt(r.start)}</td><td class="ro" style="text-align:center">${r.days ?? ""}</td><td class="ro">${fmt(r.end)}</td>
      <td></td>
      <td><div class="act"><button class="ic" data-a="delG" title="Xóa nhóm" aria-label="Xóa nhóm">✕</button></div></td></tr>`);
    if (!g.open) return;
    tasks.forEach(t => {
      const st = statusOf(t.pct);
      rows.push(`<tr data-g="${g.id}" data-t="${t.id}">
        <td class="indent"><input data-f="name" value="${esc(t.name)}" aria-label="Tên việc"></td>
        <td><select class="st" data-f="status" aria-label="Trạng thái">
          ${Object.keys(LABEL).map(k => `<option value="${k}" ${k === st ? "selected" : ""}>${LABEL[k]}</option>`).join("")}</select></td>
        <td><input class="pct" data-f="pct" type="number" min="0" max="100" step="5" value="${t.pct}" aria-label="Phần trăm hoàn thành"></td>
        <td><input class="date" data-f="start" type="date" value="${t.start || ""}" aria-label="Ngày bắt đầu"></td>
        <td><input class="num" data-f="days" type="number" min="1" value="${t.days}" aria-label="Số ngày"></td>
        <td class="ro">${fmt(endOf(t))}</td>
        <td><textarea data-f="note" rows="1" aria-label="Ghi chú">${esc(t.note)}</textarea></td>
        <td><div class="act"><button class="ic" data-a="delT" title="Xóa việc" aria-label="Xóa việc">✕</button></div></td></tr>`);
    });
    if (filter === "all") rows.push(`<tr class="add" data-g="${g.id}"><td colspan="8" class="indent"><button data-a="addT">＋ Thêm việc</button></td></tr>`);
  });
  document.getElementById("body").innerHTML = rows.join("") || `<tr><td colspan="8" class="empty">Không có việc nào khớp bộ lọc.</td></tr>`;

  const all = groups.flatMap(g => g.tasks), c = { todo: 0, doing: 0, done: 0 };
  all.forEach(t => c[statusOf(t.pct)]++);
  document.getElementById("foot").innerHTML =
    `<strong>Tổng ${all.length} việc</strong>` +
    `<span><i class="dot" style="background:var(--done)"></i>${c.done} đã xong</span>` +
    `<span><i class="dot" style="background:var(--doing)"></i>${c.doing} đang làm</span>` +
    `<span><i class="dot" style="background:var(--todo)"></i>${c.todo} chưa làm</span>`;
}

// ---------- tương tác ----------
const body = document.getElementById("body");
const findG = id => groups.find(g => g.id === id);

body.addEventListener("change", e => {
  const f = e.target.dataset.f; if (!f) return;
  const tr = e.target.closest("tr"), g = findG(tr.dataset.g);
  if (f === "gname") { g.name = e.target.value; save(); return; }
  const t = g.tasks.find(x => x.id === tr.dataset.t), v = e.target.value;
  if (f === "name") t.name = v;
  if (f === "note") t.note = v;
  if (f === "start") t.start = v;
  if (f === "days") t.days = Math.max(1, parseInt(v) || 1);
  if (f === "pct") t.pct = Math.min(100, Math.max(0, parseInt(v) || 0));
  if (f === "status") t.pct = v === "done" ? 100 : v === "todo" ? 0 : (t.pct > 0 && t.pct < 100 ? t.pct : 50);
  save(); render();
});

body.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const tr = b.closest("tr"), g = findG(tr.dataset.g), a = b.dataset.a;
  if (a === "tog") g.open = !g.open;
  if (a === "addT") addTask(g);
  if (a === "delT" && confirm("Xóa việc này?")) g.tasks = g.tasks.filter(t => t.id !== tr.dataset.t);
  if (a === "delG" && confirm("Xóa cả nhóm và các việc bên trong?")) groups = groups.filter(x => x !== g);
  save(); render();
});

function addTask(g) {
  const last = g.tasks[g.tasks.length - 1];
  const start = last && last.start ? iso(new Date(+endOf(last) + DAY)) : iso(new Date());
  g.tasks.push(T("Việc mới", start, 1, 0)); g.open = true;
}
document.getElementById("addTask").onclick = () => {
  if (!groups.length) groups.push({ id: uid(), name: "Nhóm mới", open: true, tasks: [] });
  addTask(groups[groups.length - 1]); save(); render();
};
document.getElementById("addGroup").onclick = () => {
  groups.push({ id: uid(), name: (groups.length + 1) + ". NHÓM MỚI", open: true, tasks: [] }); save(); render();
};
document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
document.getElementById("print").onclick = () => window.print();
document.getElementById("exp").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(groups, null, 2)], { type: "application/json" }));
  a.download = "tien-do-thi-cong.json"; a.click();
};
document.getElementById("imp").onclick = () => document.getElementById("file").click();
document.getElementById("file").onchange = async e => {
  try {
    const data = JSON.parse(await e.target.files[0].text());
    if (!Array.isArray(data)) throw 0;
    groups = data; save(); render();
  } catch (err) { alert("File JSON không hợp lệ."); }
};

render();
</script>
</body>
</html>
